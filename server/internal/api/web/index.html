<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TradePost — Auction Data</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="brand">TradePost <span>Auction Data</span></div>
    <label class="market">Market
      <select id="market"></select>
    </label>
    <div id="meta" class="meta"></div>
    <div id="auth-area" class="auth">
      <button type="button" id="auth-open" class="ghost">Sync watch</button>
    </div>
  </header>

  <main>
    <section class="search-panel">
      <form id="search-form" autocomplete="off">
        <input id="query" type="search" placeholder="Search item name or item ID…">
        <button type="submit">Search</button>
      </form>
      <div class="toolbar">
        <label class="watch-toggle">
          <input id="watch-only" type="checkbox"> Watchlist only
        </label>
        <span id="sync-state" class="sync-state"></span>
        <span id="status" class="status"></span>
      </div>
      <div id="results" class="results">
        <p class="empty">Loading…</p>
      </div>
    </section>

    <aside id="detail" class="detail">
      <p class="empty">Select an item to see price history and the market comparison.</p>
    </aside>
  </main>

  <dialog id="auth-dialog">
    <form id="auth-form" method="dialog">
      <h2>Sync your watchlist</h2>
      <p>In game, type <code>/tradepost login</code> and enter the short code below.</p>
      <input id="auth-code" type="text" maxlength="12" placeholder="ABCD2345"
             autocomplete="off" spellcheck="false">
      <p id="auth-error" class="error"></p>
      <div class="dialog-actions">
        <button type="button" id="auth-cancel" class="ghost">Cancel</button>
        <button type="submit">Log in</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
