services:
  postgres:
    image: postgres:18-alpine
    container_name: babo-forever-postgres
    environment:
      POSTGRES_USER: babo
      POSTGRES_PASSWORD: babo
      POSTGRES_DB: babo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U babo -d babo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
