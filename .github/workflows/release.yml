name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build release archives
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version-file: companion/go.mod
          cache-dependency-path: companion/go.sum

      - name: Build binaries
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME#v}"
          (cd companion && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.version=$VERSION" -o ../dist/tradepost ./cmd/tradepost)
          (cd companion && CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.version=$VERSION" -o ../dist/tradepost.exe ./cmd/tradepost)

      - name: Package addon (CurseForge/WoWUI)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          STAGE=dist/addon-stage
          rm -rf "$STAGE"
          mkdir -p "$STAGE/TradePost"
          cp -R addon/TradePost/. "$STAGE/TradePost/"
          (cd "$STAGE" && zip -qr "../TradePost-${VERSION}.zip" TradePost)
          ls -lh "dist/TradePost-${VERSION}.zip"

      - name: Package Windows
        run: python3 tools/release/package_windows.py --version "${GITHUB_REF_NAME#v}" --binary dist/tradepost.exe

      - name: Package Linux
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          STAGE="dist/linux-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp dist/tradepost "$STAGE/"
          mkdir -p "$STAGE/addon"
          cp -R addon/TradePost "$STAGE/addon/TradePost"
          mkdir -p "$STAGE/data-addon"
          cp -R data-addon/TradePost_Data "$STAGE/data-addon/TradePost_Data"
          cp -R data-addon/TradePost_LiveData "$STAGE/data-addon/TradePost_LiveData"
          cat > "$STAGE/README.txt" <<'TXT'
          TradePost Companion (Linux x64)

          Run ./tradepost and open http://127.0.0.1:8787/setup.
          Select the WoW folder, server and market in the wizard.

          The addon folders are in addon/ and data-addon/; the companion installs
          them automatically from this directory.
          TXT
          tar -czf "dist/tradepost-${VERSION}-linux-amd64.tar.gz" -C "$STAGE" .

      - name: Add stable download names
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp "dist/TradePost-${VERSION}.zip" dist/TradePost-addon.zip
          cp "dist/tradepost-${VERSION}-linux-amd64.tar.gz" dist/tradepost-linux-amd64.tar.gz
          cp "dist/tradepost-companion-${VERSION}-windows-amd64.zip" dist/tradepost-companion-windows-amd64.zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*windows-amd64.zip
            dist/*linux-amd64.tar.gz
            dist/TradePost-*.zip
          generate_release_notes: true

      - name: Read release notes
        id: release_notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY="$(gh release view "$GITHUB_REF_NAME" --json body -q .body 2>/dev/null || true)"
          if [ -z "$BODY" ]; then
            BODY="Release $GITHUB_REF_NAME: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          BODY="$(printf '%s\n\n## Companion downloads\nCurseForge hosts the addon only. Download the companion for your platform from GitHub:\n\n- Linux: https://github.com/%s/releases/download/%s/tradepost-%s-linux-amd64.tar.gz\n- Windows: https://github.com/%s/releases/download/%s/tradepost-companion-%s-windows-amd64.zip' "$BODY" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$VERSION" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$VERSION")"
          {
            echo 'body<<CURSEFORGE_CHANGELOG_EOF'
            printf '%s\n' "$BODY"
            echo 'CURSEFORGE_CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Check CurseForge configuration
        id: curseforge
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID || secrets.CURSEFORGE_PROJECT_ID }}
        run: |
          if [ -z "${CURSEFORGE_API_TOKEN}" ] || [ -z "${CURSEFORGE_PROJECT_ID}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=CurseForge upload skipped::Set the CURSEFORGE_API_TOKEN secret and CURSEFORGE_PROJECT_ID variable to enable automatic uploads."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "CurseForge upload enabled for project ${CURSEFORGE_PROJECT_ID}."
          fi

      - name: Upload addon to CurseForge
        if: ${{ startsWith(github.ref, 'refs/tags/v') && steps.curseforge.outputs.enabled == 'true' }}
        uses: itsmeow/curseforge-upload@v3
        with:
          token: ${{ secrets.CURSEFORGE_API_TOKEN }}
          project_id: ${{ vars.CURSEFORGE_PROJECT_ID || secrets.CURSEFORGE_PROJECT_ID }}
          game_endpoint: wow
          file_path: dist/TradePost-${{ steps.version.outputs.value }}.zip
          game_versions: ${{ vars.CURSEFORGE_GAME_VERSIONS || '88568:1.60.1' }}
          release_type: release
          display_name: TradePost ${{ steps.version.outputs.value }}
          changelog: ${{ steps.release_notes.outputs.body }}
          changelog_type: markdown
